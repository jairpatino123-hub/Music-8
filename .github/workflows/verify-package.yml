name: Verify package hash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute package SHA-256
        id: hash
        run: echo "sha256=$(sha256sum packages/Synthetiq-Music-Gateway-1.4.4.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Sync catalogue SHA-256
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json, os
          p='catalogue.json'
          with open(p, encoding='utf-8') as f: data=json.load(f)
          data['modules'][0]['sha256']=os.environ['SHA256']
          with open(p,'w',encoding='utf-8') as f:
              json.dump(data,f,indent=2,ensure_ascii=False)
              f.write('\n')
          PY
      - name: Commit catalogue if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json
          git diff --cached --quiet && exit 0
          git commit -m "Verify package SHA-256"
          git push
